plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client { client() }
    }
    mods {
        better_spell_casting { sourceSet sourceSets.main }
    }
}

dependencies {
    def spellEnginePath = providers.gradleProperty('spell_engine_jar').orNull
            ?: System.getenv('SPELL_ENGINE_JAR')
            ?: 'D:/projects/better-spell-casting/mc-version/.minecraft/versions/26.1-NeoForge_26.1.0.19-beta/mods/[法术引擎] spell_engine-neoforge-1.10.5+26.1.2.jar'
    def spellEngineJar = file(spellEnginePath)
    if (!spellEngineJar.isFile()) throw new GradleException("Spell Engine JAR not found: $spellEnginePath")
    implementation files(spellEngineJar)
    runtimeOnly files(spellEngineJar)
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    def tinyConfigJar = layout.buildDirectory.file('generated/dependencies/tiny-config.jar').get().asFile
    compileOnly files(tinyConfigJar)
    tasks.register('extractTinyConfig') {
        inputs.file(spellEngineJar)
        outputs.file(tinyConfigJar)
        doLast {
            tinyConfigJar.parentFile.mkdirs()
            new java.util.zip.ZipFile(spellEngineJar).withCloseable { zip ->
                def entry = zip.entries().find { it.name.toLowerCase(Locale.ROOT).startsWith('meta-inf/jars/') && it.name.toLowerCase(Locale.ROOT).contains('tiny-config') && it.name.toLowerCase(Locale.ROOT).endsWith('.jar') }
                if (entry == null) throw new GradleException("TinyConfig was not found in $spellEngineJar")
                zip.getInputStream(entry).withCloseable { input -> tinyConfigJar.withOutputStream { output -> input.transferTo(output) } }
            }
        }
    }
    tasks.named('compileJava') { dependsOn('extractTinyConfig') }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest.attributes([
            'Specification-Title': 'better-spell-casting',
            'Specification-Vendor': 'Better Spellcasting contributors',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Better Spellcasting contributors',
            'MixinConfigs': 'better-spell-casting.mixins.json'
    ])
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
