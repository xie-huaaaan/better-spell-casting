plugins {
    id 'dev.architectury.loom-no-remap' version "${loom_version}"
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    fabric()
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    def spellEnginePath = providers.gradleProperty('spell_engine_jar').orNull
            ?: System.getenv('SPELL_ENGINE_JAR')
            ?: 'D:/projects/better-spell-casting/mc-version/.minecraft/versions/1.20.1-Fabric 0.19.5/mods/[法术引擎] spell_engine-fabric-1.10.7+1.20.1.jar'
    def spellEngineJar = file(spellEnginePath)
    if (!spellEngineJar.isFile()) {
        throw new GradleException("Spell Engine JAR not found. Set -Pspell_engine_jar=<path> or SPELL_ENGINE_JAR.")
    }
    implementation files(spellEngineJar)
    def tinyConfigJar = layout.buildDirectory.file('generated/dependencies/tiny-config.jar').get().asFile
    compileOnly files(tinyConfigJar)
    tasks.register('extractTinyConfig') {
        inputs.file(spellEngineJar)
        outputs.file(tinyConfigJar)
        doLast {
            tinyConfigJar.parentFile.mkdirs()
            new java.util.zip.ZipFile(spellEngineJar).withCloseable { zip ->
                def entry = zip.entries().find { it.name.toLowerCase(Locale.ROOT).startsWith('meta-inf/jars/')
                        && it.name.toLowerCase(Locale.ROOT).contains('tiny-config')
                        && it.name.toLowerCase(Locale.ROOT).endsWith('.jar') }
                if (entry == null) throw new GradleException("TinyConfig was not found in $spellEngineJar")
                zip.getInputStream(entry).withCloseable { input ->
                    tinyConfigJar.withOutputStream { output -> input.transferTo(output) }
                }
            }
        }
    }
    tasks.named('compileJava') { dependsOn('extractTinyConfig') }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'spell_engine_version', project.spell_engine_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'spell_engine_version': project.spell_engine_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
