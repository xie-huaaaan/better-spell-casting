plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir(providers.gradleProperty('run_dir').orElse('run').get())
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    def spellEnginePath = providers.gradleProperty('spell_engine_jar').orNull
            ?: System.getenv('SPELL_ENGINE_JAR')
            ?: 'D:/projects/better-spell-casting/mc-version/.minecraft/versions/1.20.1-Fabric 0.19.5/mods/[法术引擎] spell_engine-fabric-1.10.7+1.20.1.jar'
    def spellEngineJar = file(spellEnginePath)
    if (!spellEngineJar.isFile()) {
        throw new GradleException("Spell Engine JAR not found. Set -Pspell_engine_jar=<path> or SPELL_ENGINE_JAR.")
    }
    modImplementation files(spellEngineJar)
    def tinyConfigJar = layout.buildDirectory.file('generated/dependencies/tiny-config.jar').get().asFile
    compileOnly files(tinyConfigJar)
    tasks.register('extractTinyConfig') {
        inputs.file(spellEngineJar)
        outputs.file(tinyConfigJar)
        doLast {
            tinyConfigJar.parentFile.mkdirs()
            new java.util.zip.ZipFile(spellEngineJar).withCloseable { zip ->
                def entry = zip.entries().find { it.name.toLowerCase(Locale.ROOT).startsWith('meta-inf/jars/')
                        && it.name.toLowerCase(Locale.ROOT).contains('tiny-config')
                        && it.name.toLowerCase(Locale.ROOT).endsWith('.jar') }
                if (entry == null) throw new GradleException("TinyConfig was not found in $spellEngineJar")
                zip.getInputStream(entry).withCloseable { input ->
                    tinyConfigJar.withOutputStream { output -> input.transferTo(output) }
                }
            }
        }
    }
    tasks.named('compileJava') { dependsOn('extractTinyConfig') }
}

tasks.named('remapSourcesJar') { dependsOn('extractTinyConfig') }
tasks.named('remapJar') { dependsOn('extractTinyConfig') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
