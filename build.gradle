plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    def spellEngineJar = file("D:/HMCL/.minecraft/versions/元素觉醒1.4.6/mods/spell_engine-0.15.12+1.20.1.jar")
    modImplementation files(spellEngineJar)
    // Spell Engine embeds TinyConfig instead of exposing it as a normal Gradle dependency.
    // Connector's extracted copy supplies the classes needed by the client HUD API at compile time.
    compileOnly files('D:/HMCL/.minecraft/versions/元素觉醒1.4.6/mods/.connector/temp/spell_engine-0.15.12+1.20.1$TinyConfig-2.3.2.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
